<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TeachAI</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,sans-serif;
background:#f7f8ff;
color:#202235;
}

button,input,textarea,select{
font-family:inherit;
}

button{cursor:pointer}

header{
height:76px;
background:white;
border-bottom:1px solid #e7e7f0;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 6%;
position:sticky;
top:0;
z-index:20;
}

.brand{
display:flex;
align-items:center;
gap:11px;
font-size:24px;
font-weight:bold;
}

.logo{
width:42px;
height:42px;
border-radius:13px;
background:linear-gradient(135deg,#7057ff,#9b7cff);
position:relative;
box-shadow:0 7px 18px rgba(112,87,255,.25);
}

.logo:before{
content:"";
position:absolute;
width:22px;
height:16px;
background:white;
border-radius:7px;
left:10px;
top:10px;
}

.logo:after{
content:"";
position:absolute;
width:7px;
height:7px;
background:#7057ff;
border-radius:50%;
left:18px;
top:15px;
}

.nav{
display:flex;
gap:8px;
}

.nav button{
background:transparent;
border:0;
padding:10px 13px;
border-radius:9px;
color:#555;
}

.nav button:hover{
background:#f0edff;
color:#7057ff;
}

main{
min-height:calc(100vh - 76px);
}

.screen{
max-width:1050px;
margin:auto;
padding:55px 22px;
text-align:center;
}

.small{
font-size:13px;
font-weight:bold;
letter-spacing:1.5px;
color:#7057ff;
margin-bottom:15px;
}

h1{
font-size:58px;
line-height:1.05;
margin:0 0 20px;
}

h2{
font-size:38px;
margin:10px 0 15px;
}

h3{
margin-top:0;
}

.description{
max-width:720px;
margin:0 auto 30px;
font-size:18px;
line-height:1.6;
color:#686a7c;
}

.primary{
border:0;
background:#7057ff;
color:white;
padding:14px 26px;
border-radius:11px;
font-weight:bold;
font-size:16px;
box-shadow:0 8px 20px rgba(112,87,255,.22);
}

.primary:hover{
background:#5c43e8;
transform:translateY(-1px);
}

.secondary{
background:white;
border:1px solid #ddd;
padding:12px 22px;
border-radius:10px;
color:#444;
}

.secondary:hover{
border-color:#7057ff;
color:#7057ff;
}

.cards{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:16px;
margin:35px auto;
max-width:900px;
}

.card{
width:190px;
min-height:110px;
background:white;
border:1px solid #e4e3ef;
border-radius:17px;
padding:25px 15px;
font-size:17px;
font-weight:bold;
color:#303044;
transition:.2s;
}

.card:hover{
border-color:#7057ff;
transform:translateY(-4px);
box-shadow:0 12px 25px rgba(112,87,255,.12);
color:#7057ff;
}

.features{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:16px;
margin-top:45px;
}

.feature{
background:white;
border:1px solid #e6e6ef;
border-radius:16px;
padding:22px;
width:205px;
}

.feature strong{
display:block;
margin-bottom:8px;
}

.feature span{
color:#77798a;
font-size:14px;
line-height:1.5;
}

.dashboard{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin:30px auto;
max-width:900px;
}

.stat{
background:white;
border:1px solid #e5e5ef;
border-radius:16px;
padding:22px;
}

.stat-number{
font-size:30px;
font-weight:bold;
color:#7057ff;
}

.stat-label{
font-size:13px;
color:#777;
margin-top:5px;
}

.panel{
background:white;
border:1px solid #e5e5ef;
border-radius:20px;
padding:28px;
max-width:760px;
margin:25px auto;
text-align:left;
box-shadow:0 8px 25px rgba(30,30,70,.04);
}

.lesson{
max-width:760px;
margin:25px auto;
background:white;
border:1px solid #e5e5ef;
border-radius:20px;
padding:28px;
text-align:left;
}

.teacher{
display:flex;
gap:14px;
background:#f0edff;
padding:18px;
border-radius:14px;
margin-bottom:22px;
}

.teacher-icon{
width:44px;
height:44px;
border-radius:12px;
background:#7057ff;
color:white;
display:flex;
align-items:center;
justify-content:center;
font-weight:bold;
flex-shrink:0;
}

.chat{
height:360px;
overflow-y:auto;
background:#f8f8fc;
border-radius:15px;
padding:18px;
margin-bottom:15px;
}

.message{
max-width:80%;
padding:12px 15px;
border-radius:14px;
margin:8px 0;
line-height:1.5;
}

.ai{
background:#ebe7ff;
}

.user{
background:#7057ff;
color:white;
margin-left:auto;
}

.chat-input{
display:flex;
gap:8px;
}

.chat-input input{
flex:1;
padding:14px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
}

.chat-input input:focus{
border-color:#7057ff;
}

.question{
font-size:24px;
font-weight:bold;
line-height:1.4;
margin:25px 0;
}

.option{
display:block;
width:100%;
text-align:left;
padding:15px;
margin:9px 0;
background:white;
border:1px solid #ddd;
border-radius:11px;
}

.option:hover{
border-color:#7057ff;
background:#faf9ff;
}

.correct{
background:#e8faef!important;
border-color:#38a169!important;
}

.wrong{
background:#fff0f0!important;
border-color:#e05252!important;
}

.progress{
height:8px;
background:#e8e8f1;
border-radius:20px;
overflow:hidden;
margin:10px 0 25px;
}

.progress-bar{
height:100%;
background:#7057ff;
transition:.3s;
}

.feedback{
padding:14px;
border-radius:11px;
margin-top:15px;
display:none;
}

.good{
background:#eaf9ef;
color:#176d38;
}

.bad{
background:#fff0f0;
color:#a32828;
}

textarea{
width:100%;
min-height:140px;
border:1px solid #ddd;
border-radius:12px;
padding:15px;
resize:vertical;
outline:none;
font-size:16px;
}

textarea:focus{
border-color:#7057ff;
}

input,select{
padding:13px;
border:1px solid #ddd;
border-radius:10px;
outline:none;
}

.focus-clock{
font-size:65px;
font-weight:bold;
color:#7057ff;
margin:25px;
}

.todo{
display:flex;
gap:10px;
margin-bottom:15px;
}

.todo input{
flex:1;
}

.todo-list{
text-align:left;
margin-top:20px;
}

.todo-item{
background:#f8f8fc;
padding:13px;
border-radius:10px;
margin:7px 0;
}

.result{
font-size:55px;
font-weight:bold;
color:#7057ff;
}

.badge{
display:inline-block;
padding:7px 12px;
border-radius:20px;
background:#eeeaff;
color:#7057ff;
font-size:13px;
font-weight:bold;
margin:4px;
}

.back{
margin-top:25px;
}

@media(max-width:750px){

.nav{
display:none;
}

h1{
font-size:40px;
}

h2{
font-size:30px;
}

.dashboard{
grid-template-columns:repeat(2,1fr);
}

}

@media(max-width:450px){

.dashboard{
grid-template-columns:1fr 1fr;
}

.card{
width:145px;
}

}
</style>
</head>

<body>

<header>

<div class="brand">
<div class="logo"></div>
TeachAI
</div>

<div class="nav">
<button onclick="home()">Home</button>
<button onclick="dashboard()">Dashboard</button>
<button onclick="chat()">Doubt Chat</button>
<button onclick="focusMode()">Focus</button>
</div>

</header>

<main id="app"></main>

<script>

/* =========================
   DATA
========================= */

let state=JSON.parse(localStorage.getItem("teachAI"))||{
xp:0,
streak:1,
tests:0,
correct:0,
mistakes:[],
personality:"Friendly",
tasks:[]
};

let selectedClass="";
let selectedSubject="";
let selectedTopic="";
let testIndex=0;
let testScore=0;
let testQuestions=[];

const data={

Math:{
Introduction:[
["What is 5 + 3?","8"],
["What is 10 - 4?","6"],
["What is 2 × 5?","10"]
],
Basics:[
["What is 10 × 2?","20"],
["What is 20 ÷ 4?","5"],
["What is 7 + 8?","15"]
],
Practice:[
["What is 15 - 7?","8"],
["What is 6 × 6?","36"],
["What is 24 ÷ 6?","4"]
],
Revision:[
["What is 12 ÷ 3?","4"],
["What is 9 × 5?","45"],
["What is 30 - 12?","18"]
]
},

Science:{
Introduction:[
["What planet do we live on?","earth"],
["What gas do humans breathe?","oxygen"],
["What is H2O?","water"]
],
Basics:[
["What force pulls objects toward Earth?","gravity"],
["What organ pumps blood?","heart"],
["What do plants use to make food?","sunlight"]
],
Practice:[
["What gas do plants release during photosynthesis?","oxygen"],
["What is the center of an atom called?","nucleus"],
["What is frozen water called?","ice"]
],
Revision:[
["What is H2O commonly called?","water"],
["What force attracts objects?","gravity"],
["What organ helps us breathe?","lungs"]
]
},

English:{
Introduction:[
["Opposite of hot?","cold"],
["Plural of book?","books"],
["Past tense of go?","went"]
],
Basics:[
["Past tense of eat?","ate"],
["Opposite of big?","small"],
["Plural of child?","children"]
],
Practice:[
["Past tense of write?","wrote"],
["Opposite of difficult?","easy"],
["Plural of mouse?","mice"]
],
Revision:[
["Opposite of early?","late"],
["Past tense of see?","saw"],
["Plural of tooth?","teeth"]
]
},

"SST":{
Introduction:[
["Capital of India?","new delhi"],
["Continent containing India?","asia"],
["National currency of India?","rupee"]
],
Basics:[
["How many states are in India?","28"],
["What is democracy?","government by people"],
["Capital of Punjab?","chandigarh"]
],
Practice:[
["Capital of Australia?","canberra"],
["Largest continent?","asia"],
["Capital of France?","paris"]
],
Revision:[
["Capital of India?","new delhi"],
["Continent containing India?","asia"],
["Currency of India?","rupee"]
]
}

};


/* =========================
   SAVE
========================= */

function save(){

localStorage.setItem(
"teachAI",
JSON.stringify(state)
);

}


/* =========================
   HOME
========================= */

function home(){

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
YOUR PERSONAL AI TEACHER
</div>

<h1>
Learn smarter.<br>
Understand better.
</h1>

<p class="description">
TeachAI helps you learn, practice, ask doubts,
test yourself and understand difficult topics.
</p>

<button class="primary"
onclick="chooseClass()">
Start Learning
</button>

<div class="features">

<div class="feature">
<strong>AI-style Teacher</strong>
<span>
Learn through explanations and questions.
</span>
</div>

<div class="feature">
<strong>Doubt Chat</strong>
<span>
Ask questions when you are stuck.
</span>
</div>

<div class="feature">
<strong>Quick Tests</strong>
<span>
Check how much you actually remember.
</span>
</div>

<div class="feature">
<strong>Teach-Back</strong>
<span>
Explain the lesson yourself to prove understanding.
</span>
</div>

</div>

</section>

`;

}


/* =========================
   DASHBOARD
========================= */

function dashboard(){

let accuracy=state.tests?
Math.round((state.correct/state.tests)*100):0;

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
YOUR LEARNING DASHBOARD
</div>

<h2>Your Progress</h2>

<div class="dashboard">

<div class="stat">
<div class="stat-number">${state.xp}</div>
<div class="stat-label">XP</div>
</div>

<div class="stat">
<div class="stat-number">${state.streak}</div>
<div class="stat-label">Day Streak</div>
</div>

<div class="stat">
<div class="stat-number">${state.tests}</div>
<div class="stat-label">Questions</div>
</div>

<div class="stat">
<div class="stat-number">${accuracy}%</div>
<div class="stat-label">Accuracy</div>
</div>

</div>

<div class="panel">

<h3>Your Level</h3>

<p>
${getLevel()}
</p>

<div class="progress">
<div class="progress-bar"
style="width:${Math.min(state.xp%100,100)}%">
</div>
</div>

</div>

<div class="panel">

<h3>Your Features</h3>

<button class="primary"
onclick="chat()">
Doubt Chat
</button>

<button class="secondary"
onclick="focusMode()">
Focus Mode
</button>

<button class="secondary"
onclick="planner()">
Study Planner
</button>

<button class="secondary"
onclick="dailyChallenge()">
Daily Challenge
</button>

</div>

</section>

`;

}


function getLevel(){

let level=Math.floor(state.xp/100)+1;

return "Level "+level+" • "+state.xp+" XP";

}


/* =========================
   CLASS
========================= */

function chooseClass(){

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
STEP 1
</div>

<h2>Choose your class</h2>

<p class="description">
Select your class to personalize your learning.
</p>

<div class="cards">

${[6,7,8,9,10].map(c=>`

<button class="card"
onclick="selectClass(${c})">
Class ${c}
</button>

`).join("")}

</div>

<button class="secondary back"
onclick="home()">
Back
</button>

</section>

`;

}


function selectClass(c){

selectedClass=c;

chooseSubject();

}


/* =========================
   SUBJECT
========================= */

function chooseSubject(){

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
STEP 2 • CLASS ${selectedClass}
</div>

<h2>Choose a subject</h2>

<div class="cards">

<button class="card"
onclick="selectSubject('Math')">
Math
</button>

<button class="card"
onclick="selectSubject('Science')">
Science
</button>

<button class="card"
onclick="selectSubject('English')">
English
</button>

<button class="card"
onclick="selectSubject('SST')">
Social Studies
</button>

</div>

<button class="secondary back"
onclick="chooseClass()">
Back
</button>

</section>

`;

}


function selectSubject(s){

selectedSubject=s;

chooseTopic();

}


/* =========================
   TOPIC
========================= */

function chooseTopic(){

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
STEP 3 • ${selectedSubject.toUpperCase()}
</div>

<h2>Choose a topic</h2>

<p class="description">
Learn first, then test yourself.
</p>

<div class="cards">

${["Introduction","Basics","Practice","Revision"].map(t=>`

<button class="card"
onclick="lesson('${t}')">
${t}
</button>

`).join("")}

</div>

<button class="secondary back"
onclick="chooseSubject()">
Back
</button>

</section>

`;

}


/* =========================
   LESSON
========================= */

function lesson(topic){

selectedTopic=topic;

let q=data[selectedSubject][topic][0];

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
CLASS ${selectedClass} • ${selectedSubject}
</div>

<h2>${topic}</h2>

<div class="lesson">

<div class="teacher">

<div class="teacher-icon">T</div>

<div>
<strong>TeachAI Teacher</strong>
<p>
Let's understand this topic step by step.
</p>
</div>

</div>

<h3>Quick question</h3>

<div class="question">
${q[0]}
</div>

<input
id="lessonAnswer"
style="width:100%;padding:14px;border:1px solid #ddd;border-radius:10px"
placeholder="Type your answer">

<br><br>

<button class="primary"
onclick="checkLesson('${q[1]}')">
Check
</button>

<button class="secondary"
onclick="explainAnotherWay()">
Explain Another Way
</button>

<div id="lessonFeedback"
class="feedback">
</div>

</div>

<div>

<button class="primary"
onclick="startTest()">
Take 5-Question Test
</button>

<button class="secondary"
onclick="chat()">
Ask a Doubt
</button>

</div>

</section>

`;

}


function checkLesson(correct){

let answer=
document.getElementById("lessonAnswer").value
.trim()
.toLowerCase();

let f=
document.getElementById("lessonFeedback");

f.style.display="block";

if(answer===correct){

f.className="feedback good";

f.innerHTML=
"Correct! Great understanding.";

state.xp+=10;

save();

}else{

f.className="feedback bad";

f.innerHTML=
"Not quite. Try again or use Explain Another Way.";

state.mistakes.push(selectedSubject);

save();

}

}


function explainAnotherWay(){

alert(
"Simple explanation:\n\n"+
"This topic can be understood by breaking it into small steps. "+
"Think of a simple real-life example, then connect that example "+
"to what you learned."
);

}


/* =========================
   TEST
========================= */

function startTest(){

testIndex=0;
testScore=0;

testQuestions=
[...data[selectedSubject][selectedTopic]]
.sort(()=>Math.random()-.5);

showTest();

}


function showTest(){

if(testIndex>=testQuestions.length){

finishTest();

return;

}

let q=testQuestions[testIndex];

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
QUICK TEST
</div>

<h2>
Question ${testIndex+1} of ${testQuestions.length}
</h2>

<div class="progress">
<div class="progress-bar"
style="width:${(testIndex/testQuestions.length)*100}%">
</div>
</div>

<div class="panel">

<div class="question">
${q[0]}
</div>

<input
id="testAnswer"
style="width:100%"
placeholder="Your answer"
onkeydown="if(event.key==='Enter') submitTest()">

<br><br>

<button class="primary"
onclick="submitTest()">
Submit
</button>

</div>

</section>

`;

}


function submitTest(){

let answer=
document.getElementById("testAnswer")
.value.trim().toLowerCase();

if(!answer){

alert("Please enter an answer.");

return;

}

let correct=
testQuestions[testIndex][1];

state.tests++;

if(answer===correct){

testScore++;

state.correct++;

state.xp+=20;

}

else{

state.mistakes.push(
selectedSubject+" • "+selectedTopic
);

}

save();

testIndex++;

showTest();

}


function finishTest(){

let percentage=
Math.round(
(testScore/testQuestions.length)*100
);

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
TEST COMPLETE
</div>

<h2>Great work!</h2>

<div class="result">
${percentage}%
</div>

<p class="description">
You got ${testScore} out of
${testQuestions.length} correct.
</p>

<div class="panel">

<h3>
${percentage>=80?
"Excellent! Keep going!":
percentage>=50?
"Good job! A little more practice will help.":
"Don't worry. Let's practice your weak areas."
}
</h3>

</div>

<button class="primary"
onclick="teachBack()">
Teach-Back Mode
</button>

<button class="secondary"
onclick="chooseTopic()">
Learn Another Topic
</button>

</section>

`;

}


/* =========================
   TEACH BACK
========================= */

function teachBack(){

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
TEACH-BACK MODE
</div>

<h2>
Now YOU be the teacher.
</h2>

<p class="description">
Explain <strong>${selectedTopic}</strong>
in ${selectedSubject} using your own words.
</p>

<div class="panel">

<textarea
id="teachBackText"
placeholder="Explain what you learned...">
</textarea>

<br><br>

<button class="primary"
onclick="evaluateTeachBack()">
Check My Explanation
</button>

</div>

</section>

`;

}


function evaluateTeachBack(){

let text=
document.getElementById("teachBackText").value;

if(text.length<20){

alert(
"Try explaining it with a little more detail."
);

return;

}

state.xp+=25;

save();

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
TEACH-BACK COMPLETE
</div>

<h2>
You explained it!
</h2>

<p class="description">
Nice work. Explaining something in your own words
is a powerful way to check your understanding.
</p>

<div class="badge">
+25 XP
</div>

<br><br>

<button class="primary"
onclick="dashboard()">
View Dashboard
</button>

</section>

`;

}


/* =========================
   DOUBT CHAT
========================= */

function chat(){

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
DOUBT ROOM
</div>

<h2>
Ask TeachAI
</h2>

<p class="description">
Stuck on something? Ask your teacher.
</p>

<div class="panel">

<div class="chat" id="chatBox">

<div class="message ai">
<strong>TeachAI</strong><br>
Hi! What's confusing you?
</div>

</div>

<div class="chat-input">

<input
id="chatInput"
placeholder="Ask your doubt..."
onkeydown="if(event.key==='Enter')sendChat()">

<button class="primary"
onclick="sendChat()">
Send
</button>

</div>

</div>

</section>

`;

}


function sendChat(){

let input=
document.getElementById("chatInput");

let text=input.value.trim();

if(!text)return;

let box=
document.getElementById("chatBox");

box.innerHTML+=`

<div class="message user">
${escapeHTML(text)}
</div>

`;

let reply=getReply(text);

setTimeout(()=>{

box.innerHTML+=`

<div class="message ai">
<strong>TeachAI</strong><br>
${reply}
</div>

`;

box.scrollTop=box.scrollHeight;

},300);

input.value="";

}


function getReply(text){

let t=text.toLowerCase();

if(t.includes("math")||
t.includes("add")||
t.includes("multiply")||
t.includes("fraction")){

return "Let's break the Math problem into small steps. Tell me the exact question and I'll guide you through it.";

}

if(t.includes("science")||
t.includes("gravity")||
t.includes("plant")){

return "Let's understand it with a simple example. Tell me which Science topic is confusing you.";

}

if(t.includes("english")||
t.includes("grammar")){

return "I can help with grammar, vocabulary and writing. Send me the sentence or question.";

}

if(t.includes("how")){

return "Good question! Let's break it down step by step instead of trying to memorize it.";

}

return "I understand your doubt. Try giving me the exact question, and we'll break it into smaller parts together.";

}


function escapeHTML(text){

return text
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;");

}


/* =========================
   FOCUS MODE
========================= */

let timer=null;
let seconds=25*60;

function focusMode(){

seconds=25*60;

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
FOCUS MODE
</div>

<h2>
25-minute study session
</h2>

<div class="focus-clock"
id="clock">
25:00
</div>

<button class="primary"
onclick="startTimer()">
Start
</button>

<button class="secondary"
onclick="pauseTimer()">
Pause
</button>

<button class="secondary"
onclick="resetTimer()">
Reset
</button>

</section>

`;

}


function updateClock(){

let m=
Math.floor(seconds/60)
.toString()
.padStart(2,"0");

let s=
(seconds%60)
.toString()
.padStart(2,"0");

let clock=
document.getElementById("clock");

if(clock)
clock.textContent=m+":"+s;

if(seconds<=0){

clearInterval(timer);

state.xp+=20;

save();

alert("Focus session complete! +20 XP");

}

}


function startTimer(){

clearInterval(timer);

timer=setInterval(()=>{

if(seconds>0){

seconds--;

updateClock();

}

},1000);

}


function pauseTimer(){

clearInterval(timer);

}


function resetTimer(){

clearInterval(timer);

seconds=25*60;

updateClock();

}

========================= */

function planner(){

document.getElementById("app").innerHTML=`

<section class="screen">

<div class="small">
STUDY PLANNER
</div>

<h2>
Plan your study
</h2>

<div class="panel">

<div class="todo">

<input
id="task"
placeholder="Example: Finish Math chapter">

<button class="primary"
onclick="addTask()">
Add
</button>

</div>

<div class="todo-list"
id="tasks">
${renderTasks()}
</div>

</div>

</section>

`;

}


function renderTasks(){

if(!state.tasks.length)
return "<p style='color:#777'>No tasks yet.</p>";

return state.tasks.map((x,i)=>`

<div class="todo-item">
${i+1}. ${escapeHTML(x)}
</div>

`).join("");

}


function addTask(){

let input=
document.getElementById("task");

let value=input.value.trim();

if(!value)return;

state.tasks.push(value);

save();

planner();

}
